[package]
name = "ring-log"
version = "0.2.15"
edition = "2021"
description = "High-performance logger with lock-free ring buffer"
license = "MIT"
repository = "https://github.com/freergit/ring-log.git"
readme = "README.md"
keywords = ["log", "logger", "logging", "ring-buffer", "multi-threading"]

[dependencies]
chrono = "0.4.39"
crossbeam = "0.8.4"
lock_freedom = "0.1.1"
timing_rdtsc = "0.1.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmark"
harness = false